services:
  # Base de données MongoDB
  mongo:
    image: mongo:latest
    container_name: crew-crm-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_INITDB_DATABASE: crew-crm
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    networks:
      - crew-crm-network
    restart: unless-stopped
    command: --auth
    secrets:
      - mongo_root_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --eval ''db.runCommand("ping").ok'' --quiet || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Redis pour le cache et sessions
  redis:
    image: redis:latest
    container_name: crew-crm-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - crew-crm-network
    restart: unless-stopped
    command: sh -c 'redis-server --requirepass "$$(cat /run/secrets/redis_password)" --appendonly yes'
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  data-seeder:
    build: ./data-seeder
    env_file:
      - ./data-seeder/.env
    container_name: crew-crm-seeder
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crew-crm-network
    restart: "no"
    secrets:
      - mongo_root_password

  # Service BDD (port 3001)
  bdd-service:
    build: ./bdd-service
    env_file:
      - ./bdd-service/.env
    container_name: crew-crm-bdd
    ports:
      - "3001:3001"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crew-crm-network
    restart: unless-stopped
    secrets:
      - mongo_root_password
      - redis_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:3001/health || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # Service d'authentification (port 3002)
  authentication-service:
    build: ./authentication-service
    env_file:
      - ./authentication-service/.env
    container_name: crew-crm-auth
    ports:
      - "3002:3002"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crew-crm-network
    restart: unless-stopped
    secrets:
      - mongo_root_password
      - redis_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:3002/health || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # Service de notifications (port 3003)
  notification-mail-sms-service:
    build: ./notification-mail-sms-service
    env_file:
      - ./notification-mail-sms-service/.env
    container_name: crew-crm-notifications
    ports:
      - "3003:3003"
    depends_on:
      mongo:
        condition: service_healthy
      authentication-service:
        condition: service_healthy
      bdd-service:
        condition: service_healthy
    networks:
      - crew-crm-network
    restart: unless-stopped
    secrets:
      - mongo_root_password
      - redis_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:3003/health || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # Service de métriques (port 3004)
  metrics-service:
    build: ./metrics-service
    env_file:
      - ./metrics-service/.env
    container_name: crew-crm-metrics
    ports:
      - "3004:3004"
    depends_on:
      mongo:
        condition: service_healthy
      authentication-service:
        condition: service_healthy
      bdd-service:
        condition: service_healthy
    networks:
      - crew-crm-network
    restart: unless-stopped
    secrets:
      - mongo_root_password
      - redis_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:3004/health || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # Service IA (port 3005)
  service-ia:
    build: ./service-ia
    env_file:
      - ./service-ia/.env
    container_name: crew-crm-ia
    ports:
      - "3005:3005"
    depends_on:
      mongo:
        condition: service_healthy
      authentication-service:
        condition: service_healthy
      bdd-service:
        condition: service_healthy
    networks:
      - crew-crm-network
    restart: unless-stopped
    secrets:
      - mongo_root_password
      - redis_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:3005/health || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # Service de paiement (port 3006)
  payment-service:
    build: ./payment-service
    env_file:
      - ./payment-service/.env
    container_name: crew-crm-payment
    ports:
      - "3006:3006"
    depends_on:
      mongo:
        condition: service_healthy
      authentication-service:
        condition: service_healthy
    networks:
      - crew-crm-network
    restart: unless-stopped
    secrets:
      - mongo_root_password
      - redis_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:3006/health || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # Frontend NextJS (port 3000) - SE LANCE EN DERNIER
  frontend:
    build: ./front
    env_file:
      - ./front/.env
    container_name: crew-crm-frontend
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      authentication-service:
        condition: service_healthy
      bdd-service:
        condition: service_healthy
      notification-mail-sms-service:
        condition: service_healthy
      metrics-service:
        condition: service_healthy
      service-ia:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - crew-crm-network
    restart: unless-stopped
    secrets:
      - mongo_root_password
      - redis_password

networks:
  crew-crm-network:
    name: crew-crm-network
    driver: bridge

volumes:
  mongo-data:
    name: crew-crm-mongo-data
  mongo-config:
    name: crew-crm-mongo-config
  redis-data:
    name: crew-crm-redis-data

secrets:
  mongo_root_password:
    file: ./secrets/mongo_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
