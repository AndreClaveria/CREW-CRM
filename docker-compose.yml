services:
  # Base de données MongoDB
  mongo:
    image: mongo:latest
    container_name: crew-crm-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - crew-crm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis pour le cache et sessions
  redis:
    image: redis:latest
    container_name: crew-crm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - crew-crm-network
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass crew-crm-redis-password
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  data-seeder:
    build: ./data-seeder
    container_name: crew-crm-seeder
    environment:
      - AUTH_MONGO_URI=mongodb://mongo:27017/autenthication-service
      - BDD_MONGO_URI=mongodb://mongo:27017/bdd-services
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crew-crm-network
    restart: "no" # Ne redémarre pas automatiquement
  # Service BDD (port 3001)
  bdd-service:
    build: ./bdd-service
    env_file:
      - ./bdd-service/.env
    container_name: crew-crm-bdd
    ports:
      - "3001:3001"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crew-crm-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:3001/health || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # Service d'authentification (port 3002)
  authentication-service:
    build: ./authentication-service
    env_file:
      - ./authentication-service/.env
    container_name: crew-crm-auth
    ports:
      - "3002:3002"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crew-crm-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:3002/health || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # Service de notifications (port 3003)
  notification-mail-sms-service:
    build: ./notification-mail-sms-service
    env_file:
      - ./notification-mail-sms-service/.env
    container_name: crew-crm-notifications
    ports:
      - "3003:3003"
    depends_on:
      mongo:
        condition: service_healthy
      authentication-service:
        condition: service_healthy
      bdd-service:
        condition: service_healthy
    networks:
      - crew-crm-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:3003/health || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # Service de métriques (port 3004)
  metrics-service:
    build: ./metrics-service
    env_file:
      - ./metrics-service/.env
    container_name: crew-crm-metrics
    ports:
      - "3004:3004"
    depends_on:
      mongo:
        condition: service_healthy
      authentication-service:
        condition: service_healthy
      bdd-service:
        condition: service_healthy
    networks:
      - crew-crm-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:3004/health || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # Service IA (port 3005)
  service-ia:
    build: ./service-ia
    env_file:
      - ./service-ia/.env
    container_name: crew-crm-ia
    ports:
      - "3005:3005"
    depends_on:
      mongo:
        condition: service_healthy
      authentication-service:
        condition: service_healthy
      bdd-service:
        condition: service_healthy
    networks:
      - crew-crm-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:3005/health || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # Service de paiement (port 3006)
  payment-service:
    build: ./payment-service
    env_file:
      - ./payment-service/.env
    container_name: crew-crm-payment
    ports:
      - "3006:3006"
    depends_on:
      mongo:
        condition: service_healthy
      authentication-service:
        condition: service_healthy
    networks:
      - crew-crm-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:3006/health || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # Frontend NextJS (port 3000) - SE LANCE EN DERNIER
  frontend:
    build: ./front
    env_file:
      - ./front/.env
    container_name: crew-crm-frontend
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      authentication-service:
        condition: service_healthy
      bdd-service:
        condition: service_healthy
      notification-mail-sms-service:
        condition: service_healthy
      metrics-service:
        condition: service_healthy
      service-ia:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - crew-crm-network
    restart: unless-stopped

networks:
  crew-crm-network:
    name: crew-crm-network
    driver: bridge

volumes:
  mongo-data:
    name: crew-crm-mongo-data
  redis-data:
    name: crew-crm-redis-data
